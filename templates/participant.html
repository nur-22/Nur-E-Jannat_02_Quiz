{% extends 'base.html' %}

{% block title %}Participant Information{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-7">

        <div class="card shadow">

            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">Participant Information</h4>
            </div>

            <div class="card-body">

                <form method="POST">
                    {% csrf_token %}

                    {{ form.as_p }}

                    <button class="btn btn-primary w-100">
                        Save Information
                    </button>
                </form>

            </div>
        </div>

    </div>
</div>

{% endblock %}
