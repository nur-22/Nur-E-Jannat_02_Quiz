{% extends 'base.html' %}

{% block content %}

<div class="container mt-5">

    <div class="card shadow p-4">

        <h3>Delete Quiz</h3>

        <p>
            Are you sure you want to delete
            <strong>{{ quiz.title }}</strong>?
        </p>

        <p class="text-danger">
            This will also delete all questions and options
            belonging to this quiz.
        </p>

        <form method="POST">
            {% csrf_token %}

            <button type="submit" class="btn btn-danger">
                Yes, Delete Quiz
            </button>

            <a href="{% url 'dashboard' %}"
               class="btn btn-secondary">
                Cancel
            </a>
        </form>

    </div>

</div>

{% endblock %}
